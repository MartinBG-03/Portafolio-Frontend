<fieldset class="ad-radio-group" [class.is-horizontal]="orientation() === 'horizontal'">
  <legend class="ad-radio-group__legend">{{ label() }}</legend>

  @for (option of options(); track option.value) {
    <label class="ad-radio-group__option" [class.is-disabled]="isDisabledOption(option)">
      <input
        class="ad-radio-group__input"
        type="radio"
        [name]="name"
        [value]="option.value"
        [checked]="value() === option.value"
        [disabled]="isDisabledOption(option)"
        (change)="select(option)"
        (blur)="touch()"
      />
      <span class="ad-radio-group__circle" aria-hidden="true"></span>
      <span>{{ option.label }}</span>
    </label>
  }
</fieldset>
