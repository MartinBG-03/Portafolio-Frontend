<ad-form-field
  [controlId]="controlId"
  [label]="label()"
  [labelHidden]="labelHidden()"
  [optional]="optional()"
  [hint]="hint()"
  [error]="error()"
>
  <div
    class="ad-chip-group"
    role="group"
    [id]="controlId"
    [attr.aria-labelledby]="labelId()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="error() ? 'true' : null"
  >
    @for (option of options(); track option.value) {
      <ad-chip
        selectable
        [selected]="isSelected(option.value)"
        [disabled]="isDisabled() || !!option.disabled"
        (selectedChange)="toggle(option.value, $event)"
      >
        {{ option.label }}
      </ad-chip>
    } @empty {
      <p class="ad-chip-group__empty">{{ emptyMessage() }}</p>
    }
  </div>
</ad-form-field>
