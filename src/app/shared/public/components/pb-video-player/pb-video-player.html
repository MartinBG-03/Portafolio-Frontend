<div class="pb-video-player" [class.is-playing]="playing()" [class.is-started]="started()">
  <video
    #video
    class="pb-video-player__video"
    playsinline
    preload="metadata"
    [src]="src()"
    [attr.poster]="poster()"
    [attr.aria-label]="label()"
    (click)="toggle()"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onEnded()"
    (loadedmetadata)="onMetadata()"
    (timeupdate)="onTimeUpdate()"
    (durationchange)="onDurationChange()"
  ></video>

  <button
    type="button"
    class="pb-video-player__big-play"
    [attr.aria-label]="texts().play"
    (click)="toggle()"
  >
    <app-icon name="play" />
  </button>

  <div class="pb-video-player__bar">
    <input
      class="pb-video-player__seek"
      type="range"
      min="0"
      step="0.1"
      [max]="duration()"
      [value]="current()"
      [style.--progress.%]="progress()"
      [attr.aria-label]="texts().seek"
      [attr.aria-valuetext]="currentLabel() + ' / ' + durationLabel()"
      (input)="seek($event)"
    />

    <div class="pb-video-player__controls">
      <button
        type="button"
        class="pb-video-player__control"
        [attr.aria-label]="playing() ? texts().pause : texts().play"
        (click)="toggle()"
      >
        <app-icon [name]="playing() ? 'pause' : 'play'" />
      </button>

      <button
        type="button"
        class="pb-video-player__control pb-video-player__control--skip"
        [attr.aria-label]="texts().rewind"
        (click)="skip(-1)"
      >
        <app-icon name="rewind" />
        <span aria-hidden="true">{{ skipSeconds }}</span>
      </button>

      <button
        type="button"
        class="pb-video-player__control pb-video-player__control--skip"
        [attr.aria-label]="texts().forward"
        (click)="skip(1)"
      >
        <app-icon name="forward" />
        <span aria-hidden="true">{{ skipSeconds }}</span>
      </button>

      <span class="pb-video-player__time">{{ currentLabel() }} / {{ durationLabel() }}</span>

      <button
        type="button"
        class="pb-video-player__control pb-video-player__control--end"
        [attr.aria-label]="muted() ? texts().unmute : texts().mute"
        (click)="toggleMute()"
      >
        <app-icon [name]="muted() ? 'volume-mute' : 'volume'" />
      </button>
    </div>
  </div>
</div>
